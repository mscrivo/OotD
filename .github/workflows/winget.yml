name: Publish to winget

# Opens a PR on microsoft/winget-pkgs bumping MichaelScrivo.OutlookOnTheDesktop to the new release.
# Needs a WINGET_TOKEN secret (classic PAT, public_repo scope) and a fork of microsoft/winget-pkgs
# under the repo owner's account.
on:
  release:
    types: [released]

jobs:
  winget:
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: MichaelScrivo.OutlookOnTheDesktop
          installers-regex: '^ootd-.*\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
